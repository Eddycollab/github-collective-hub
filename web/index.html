<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>RepoBox</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="tokens.css">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e2f6b" media="(prefers-color-scheme: dark)">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; overflow: hidden; color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Noto Sans TC", "PingFang TC", sans-serif;
      background-color: var(--paper);
      background-image:
        linear-gradient(var(--grid-major) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 40px 40px, 40px 40px, 8px 8px, 8px 8px;
    }
    .sheet {
      height: 100dvh; max-width: 460px; margin: 0 auto;
      padding: max(12px, env(safe-area-inset-top)) var(--gutter) max(14px, env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 14px;
    }
    button, input { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

    header { display: flex; align-items: center; justify-content: space-between; }
    .mark { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 19px; letter-spacing: -0.01em; }
    .mark svg { width: 26px; height: 26px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; max-width: 60%;
      padding: 6px 10px; border: 1.5px solid var(--line); border-radius: 999px;
      background: var(--field); font-size: 13px; cursor: pointer;
    }
    .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); flex: none; }
    .chip[data-ok="1"] .dot { background: var(--cyan); }

    /* Title block: the corner table of an engineering drawing. */
    .block { position: relative; border: 2px solid var(--line); background: var(--field); }
    .block .cell { padding: 8px 12px; }
    .block .lbl { display: block; font-size: 12px; color: var(--mute); }
    .block .repo { font-size: clamp(20px, 6.2vw, 26px); font-weight: 700; line-height: 1.2;
                   overflow-wrap: anywhere; min-height: 1.2em; }
    /* Room for the stamp so it lands beside the name, not on it. */
    .block[data-state="ok"] .head { padding-right: 104px; }
    .block .row { display: grid; grid-template-columns: 1.3fr 1fr 1fr; border-top: 1.5px solid var(--line); }
    .block .row .cell + .cell { border-left: 1.5px solid var(--line); }
    .block .val { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .block[data-state="err"] #status { color: var(--err); }
    #hint { font-size: 13px; color: var(--mute); padding: 7px 12px 8px; margin: 0; border-top: 1.5px solid var(--line); }
    #hint:empty { display: none; }
    .block-actions { display: flex; gap: 8px; padding: 0 12px 12px; }
    #hint:empty + .block-actions { border-top: 1.5px solid var(--line); padding-top: 12px; }
    .block-actions:empty { display: none; }
    .stamp {
      position: absolute; right: 12px; top: 14px; pointer-events: none;
      padding: 2px 10px; border: 3px solid var(--cyan); border-radius: 6px;
      color: var(--cyan); font-weight: 800; font-size: 22px; letter-spacing: 0.08em;
      transform: rotate(-9deg); opacity: 0;
    }
    .block[data-state="ok"] .stamp { opacity: .9; animation: press .38s cubic-bezier(.2,.9,.3,1.3); }
    @keyframes press { from { transform: rotate(-9deg) scale(1.8); opacity: 0; } to { transform: rotate(-9deg) scale(1); opacity: .9; } }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 48px; padding: 0 16px; border-radius: 10px; cursor: pointer;
      border: 2px solid var(--line); background: var(--field); font-weight: 600;
    }
    .btn svg { width: 20px; height: 20px; flex: none; }
    .btn.primary { background: var(--cyan); color: var(--cyan-ink); border-color: var(--cyan); }
    .btn.small { min-height: 38px; padding: 0 12px; font-size: 14px; }
    .btn:active { transform: translateY(1px); }
    #paste { width: 100%; font-size: 17px; }
    #add { display: flex; gap: 8px; }
    #add input { flex: 1; min-width: 0; min-height: 44px; padding: 0 12px; border: 1.5px solid var(--line);
                 border-radius: 10px; background: var(--field); }

    .recent { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .recent-head { display: flex; justify-content: space-between; align-items: baseline;
                   border-bottom: 1.5px solid var(--line); padding-bottom: 4px; }
    .recent-head h2 { font-size: 15px; margin: 0; }
    .recent-head a { font-size: 14px; color: var(--cyan); font-weight: 600; text-decoration: none; }
    #recent { list-style: none; margin: 0; padding: 0; flex: 1; min-height: 0; overflow: hidden;
              -webkit-mask-image: linear-gradient(#000 80%, transparent); mask-image: linear-gradient(#000 80%, transparent); }
    #recent li a, #recent li > span { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center;
                      padding: 9px 2px; border-bottom: 1px dashed var(--grid-major); color: inherit; text-decoration: none; }
    #recent .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #recent .when { grid-column: 1; font-size: 12px; color: var(--mute); }
    #recent .tag { grid-row: 1 / 3; grid-column: 2; font-size: 13px; padding: 2px 8px; border-radius: 999px;
                   border: 1.5px solid var(--mute); color: var(--mute); }
    #recent .tag[data-s="done"] { border-color: var(--cyan); color: var(--cyan); }
    #recent .tag[data-s="failed"] { border-color: var(--err); color: var(--err); }
    #recent .empty { color: var(--mute); font-size: 14px; padding: 12px 2px; border: 0; }
    .lib-note { margin: 6px 0 0; font-size: 13px; color: var(--err); }
    .lib-note:empty { display: none; }
    #recent .tag[data-s="done"] { border-color: var(--mute); color: var(--mute); }
    #recent .when { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    dialog {
      width: min(460px, 100%); max-width: 100%; max-height: 92dvh; margin: auto auto 0;
      padding: 18px var(--gutter) max(18px, env(safe-area-inset-bottom));
      border: 2px solid var(--line); border-bottom: 0; border-radius: 16px 16px 0 0;
      background: var(--paper); color: var(--ink); overflow: auto;
    }
    dialog::backdrop { background: #0b1a3a66; }
    dialog h2 { font-size: 17px; margin: 0 0 4px; }
    dialog p { margin: 4px 0 12px; font-size: 14px; color: var(--mute); }
    dialog label { display: block; margin: 10px 0 4px; font-size: 14px; font-weight: 600; }
    dialog input { width: 100%; min-height: 44px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--field); }
    .drawer-actions { display: flex; gap: 8px; margin-top: 14px; }
    .drawer-actions .btn { flex: 1; }
    .desk { display: none; }
    a.bm { display: inline-block; padding: 8px 14px; border: 2px dashed var(--line); border-radius: 10px;
           color: inherit; text-decoration: none; font-weight: 600; background: var(--field); cursor: grab;
           white-space: nowrap; flex: none; }
    a.bm:not([href]) { cursor: default; color: var(--mute); border-color: var(--mute); }

    /* Desktop: two columns inside one screen; the bookmarklet is the main desktop path. */
    @media (min-width: 900px) {
      .sheet {
        max-width: 1080px; display: grid; gap: 18px 40px;
        grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
        grid-template-rows: auto 1fr auto auto auto auto 1fr;
        padding-top: 28px; padding-bottom: 28px;
      }
      header { grid-column: 1 / -1; }
      .block { grid-column: 1; grid-row: 3; }
      #paste { grid-column: 1; grid-row: 4; }
      #add { grid-column: 1; grid-row: 5; }
      .desk { grid-column: 1; grid-row: 6; align-self: start; display: flex; align-items: center; gap: 14px;
              padding-top: 16px; border-top: 1.5px dashed var(--grid-major); }
      .desk p { margin: 0; font-size: 14px; color: var(--mute); }
      .recent { grid-column: 2; grid-row: 3 / 7; }
      .block .repo { font-size: 32px; }
      .block .cell { padding: 10px 16px; }
      #hint { padding: 9px 16px 10px; }
      dialog { margin: auto; border-bottom: 2px solid var(--line); border-radius: 16px; max-height: 86dvh;
               padding: 22px 24px; }
    }
    @media (min-width: 900px) and (pointer: coarse) { .desk { display: none; } }
    details { margin-top: 14px; font-size: 13px; color: var(--mute); }
    pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; margin: 6px 0 0; }

    @media (prefers-reduced-motion: reduce) { .block[data-state="ok"] .stamp { animation: none; } }
  </style>
</head>
<body>
  <main class="sheet">
    <header>
      <div class="mark">
        <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M3 8l10-5 10 5v10l-10 5-10-5z"/><path d="M3 8l10 5 10-5M13 13v10"/>
        </svg>
        RepoBox
      </div>
      <button id="conn" class="chip" type="button" aria-haspopup="dialog"><i class="dot"></i><span>尚未設定</span></button>
    </header>

    <section id="block" class="block" data-state="idle" aria-live="polite">
      <div class="cell head">
        <span class="lbl">專案</span>
        <div id="block-repo" class="repo">—</div>
      </div>
      <div class="row">
        <div class="cell"><span class="lbl">狀態</span><div id="status" class="val">等待收藏</div></div>
        <div class="cell"><span class="lbl">耗時</span><div id="timing" class="val">—</div></div>
        <div class="cell"><span class="lbl">時間</span><div id="clock" class="val">—</div></div>
      </div>
      <p id="hint">從 Threads 分享給 RepoBox，或複製連結後按下方按鈕。</p>
      <div id="block-actions" class="block-actions"></div>
      <div class="stamp" aria-hidden="true">已收</div>
    </section>

    <button id="paste" class="btn primary" type="button">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <rect x="4" y="3.5" width="12" height="14" rx="1.5"/><path d="M7.5 3.5V2.5h5v1M7 9h6M7 12.5h4"/>
      </svg>
      從剪貼簿收藏
    </button>
    <form id="add">
      <input id="add-url" placeholder="或貼上 GitHub 連結" autocomplete="off" inputmode="url" aria-label="GitHub 連結">
      <button class="btn small" type="submit">收藏</button>
    </form>

    <section class="desk" aria-label="電腦書籤">
      <a id="bookmarklet" class="bm" href="#">收進 RepoBox</a>
      <p>把這顆按鈕拖到書籤列，之後在 GitHub repo 頁面按一下就收下。</p>
    </section>

    <section class="recent">
      <div class="recent-head">
        <h2>書庫</h2>
        <a id="library" href="#" target="_blank" rel="noopener">GitHub ↗</a>
      </div>
      <p id="lib-note" class="lib-note" role="status"></p>
      <ul id="recent"></ul>
    </section>
  </main>

  <dialog id="drawer" aria-labelledby="drawer-title">
    <h2 id="drawer-title">連結收藏庫</h2>
    <p>只需要設定一次。token 只存在這個瀏覽器，只會送到 GitHub。</p>
    <form id="settings">
      <label for="repo">收藏庫（帳號/repo 名稱）</label>
      <input id="repo" placeholder="your-name/repobox-library" autocomplete="off" autocapitalize="off">
      <label for="token">Fine-grained token</label>
      <input id="token" type="password" autocomplete="off" placeholder="github_pat_…">
      <div class="drawer-actions">
        <button id="drawer-close" class="btn" type="button" autofocus>關閉</button>
        <button class="btn primary" type="submit">儲存</button>
      </div>
    </form>
    <details>
      <summary>最後一次收到的分享內容</summary>
      <pre id="received">（沒有）</pre>
    </details>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
