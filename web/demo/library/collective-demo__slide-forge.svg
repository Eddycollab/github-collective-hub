<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1016" role="img" aria-labelledby="ocx-title ocx-desc" font-family="'JetBrains Mono',monospace">
  <title id="ocx-title">OpenChatX system overview</title>
  <desc id="ocx-desc">ChatGPT reaches the local OpenChatX runtime through OpenAI's Secure MCP Tunnel and tunnel-client; the HTTP server hands requests to the MCP server factory, which routes them to built-in tools, sandboxed toolboxes and an external MCP hub backed by local state and remote MCP servers.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <symbol id="icon-browser" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="16" rx="2"/>
      <line x1="2" y1="9" x2="22" y2="9"/>
      <circle cx="5.5" cy="6.5" r="0.5"/>
      <circle cx="8" cy="6.5" r="0.5"/>
    </symbol>
    <symbol id="icon-terminal" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="16" rx="2"/>
      <path d="M6 10l3 2-3 2"/>
      <line x1="11" y1="15" x2="16" y2="15"/>
    </symbol>
    <symbol id="icon-server" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="7" rx="2"/>
      <rect x="3" y="13" width="18" height="7" rx="2"/>
      <circle cx="7" cy="7.5" r="0.6"/>
      <circle cx="7" cy="16.5" r="0.6"/>
    </symbol>
    <symbol id="icon-database" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="6" rx="8" ry="3"/>
      <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
      <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
    </symbol>
    <symbol id="icon-cloud" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 18a4.5 4.5 0 1 1 .8-8.9A6 6 0 0 1 19.5 11 3.75 3.75 0 0 1 18 18H7z"/>
    </symbol>
    <symbol id="icon-chip" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="12" height="12" rx="2"/>
      <rect x="9.5" y="9.5" width="5" height="5"/>
      <path d="M9 6V3M15 6V3M9 21v-3M15 21v-3M6 9H3M6 15H3M21 9h-3M21 15h-3"/>
    </symbol>
    <symbol id="icon-gear" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3.2"/>
      <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/>
    </symbol>
    <symbol id="icon-sparkle" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/>
      <path d="M19 16l.9 2.1L22 19l-2.1.9L19 22l-.9-2.1L16 19l2.1-.9L19 16z"/>
    </symbol>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="1016" fill="#faf8f4"/>

  <!-- 主標題 -->
  <text x="600" y="84" font-size="28" letter-spacing="6" text-anchor="middle" fill="#1a1a1a">OPENCHATX · SYSTEM OVERVIEW</text>

  <!-- 分區容器 -->
  <g class="zone" id="zone-cloud" fill="none" stroke="#1a1a1a">
    <rect x="60" y="120" width="480" height="152" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="84" y="148" font-size="16" letter-spacing="3" fill="#1a1a1a" stroke="none">OPENAI CLOUD</text>
    <line x1="84" y1="156" x2="132" y2="156" stroke-width="1"/>
  </g>
  <g class="zone" id="zone-host" fill="none" stroke="#1a1a1a">
    <rect x="60" y="312" width="720" height="152" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="84" y="340" font-size="16" letter-spacing="3" fill="#1a1a1a" stroke="none">LOCAL HOST</text>
    <line x1="84" y1="348" x2="132" y2="348" stroke-width="1"/>
  </g>
  <g class="zone" id="zone-runtime" fill="none" stroke="#1a1a1a">
    <rect x="300" y="504" width="720" height="256" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="324" y="532" font-size="16" letter-spacing="3" fill="#1a1a1a" stroke="none">RUNTIME</text>
    <line x1="324" y1="540" x2="372" y2="540" stroke-width="1"/>
  </g>
  <g class="zone" id="zone-data" fill="none" stroke="#1a1a1a">
    <rect x="300" y="800" width="240" height="152" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="324" y="828" font-size="16" letter-spacing="3" fill="#1a1a1a" stroke="none">DATA</text>
    <line x1="324" y1="836" x2="372" y2="836" stroke-width="1"/>
  </g>
  <g class="zone" id="zone-remote" fill="none" stroke="#1a1a1a">
    <rect x="780" y="800" width="240" height="152" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="804" y="828" font-size="16" letter-spacing="3" fill="#1a1a1a" stroke="none">REMOTE</text>
    <line x1="804" y1="836" x2="852" y2="836" stroke-width="1"/>
  </g>

  <!-- 連線 -->
  <g fill="none" stroke="#1a1a1a" stroke-width="1.5">
    <path class="edge" id="e-chatgpt-tunnel" d="M276,216 H318" marker-end="url(#ah)"/>
    <path class="edge" id="e-tunnel-client" d="M420,248 V370" marker-end="url(#ah)"/>
    <path class="edge" id="e-desktop-client" d="M276,408 H318" stroke-dasharray="4 4"/>
    <path class="edge" id="e-client-http" d="M480,440 V562" marker-end="url(#ah)"/>
    <path class="edge" id="e-ui-http" d="M600,440 V562" marker-end="url(#ah)"/>
    <path class="edge" id="e-http-factory" d="M636,600 H678" marker-end="url(#ah)"/>
    <path class="edge" id="e-factory-builtin" d="M700,632 V652 H420 V666" marker-end="url(#ah)"/>
    <path class="edge" id="e-factory-toolbox" d="M736,632 V666" marker-end="url(#ah)"/>
    <path class="edge" id="e-factory-external" d="M840,632 V666" marker-end="url(#ah)"/>
    <path class="edge" id="e-builtin-state" d="M420,736 V858" marker-end="url(#ah)"/>
    <path class="edge" id="e-external-remote" d="M960,736 V858" marker-end="url(#ah)"/>
  </g>

  <!-- 節點 -->
  <g class="node" id="n-chatgpt">
    <rect x="84" y="184" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-sparkle" x="100" y="204" width="24" height="24"/>
    <text x="140" y="212" font-size="14" font-weight="600" fill="#1a1a1a">ChatGPT</text>
    <text x="140" y="230" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Model + planner</text>
  </g>
  <g class="node" id="n-tunnel">
    <rect x="324" y="184" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-cloud" x="340" y="204" width="24" height="24"/>
    <text x="380" y="212" font-size="14" font-weight="600" fill="#1a1a1a">Secure Tunnel</text>
    <text x="380" y="230" font-size="11" fill="#1a1a1a" fill-opacity="0.65">OpenAI MCP relay</text>
  </g>
  <g class="node" id="n-desktop">
    <rect x="84" y="376" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-gear" x="100" y="396" width="24" height="24"/>
    <text x="140" y="404" font-size="14" font-weight="600" fill="#1a1a1a">Desktop App</text>
    <text x="140" y="422" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Mac/Win app shell</text>
  </g>
  <g class="node" id="n-client">
    <rect x="324" y="376" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-terminal" x="340" y="396" width="24" height="24"/>
    <text x="380" y="404" font-size="14" font-weight="600" fill="#1a1a1a">Tunnel Client</text>
    <text x="380" y="422" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Outbound HTTPS</text>
  </g>
  <g class="node" id="n-ui">
    <rect x="564" y="376" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-browser" x="580" y="396" width="24" height="24"/>
    <text x="620" y="404" font-size="14" font-weight="600" fill="#1a1a1a">Dashboard UI</text>
    <text x="620" y="422" font-size="11" fill="#1a1a1a" fill-opacity="0.65">React admin console</text>
  </g>
  <g class="node" id="n-http">
    <rect x="444" y="568" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-server" x="460" y="588" width="24" height="24"/>
    <text x="500" y="596" font-size="14" font-weight="600" fill="#1a1a1a">HTTP Server</text>
    <text x="500" y="614" font-size="11" fill="#1a1a1a" fill-opacity="0.65">MCP + dashboard API</text>
  </g>
  <g class="node" id="n-factory">
    <rect x="684" y="568" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-gear" x="700" y="588" width="24" height="24"/>
    <text x="740" y="596" font-size="14" font-weight="600" fill="#1a1a1a">Server Factory</text>
    <text x="740" y="614" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Tool registration</text>
  </g>
  <g class="node" id="n-builtin">
    <rect x="324" y="672" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-terminal" x="340" y="692" width="24" height="24"/>
    <text x="380" y="700" font-size="14" font-weight="600" fill="#1a1a1a">Built-in Tools</text>
    <text x="380" y="718" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Shell, file, web</text>
  </g>
  <g class="node" id="n-toolbox">
    <rect x="564" y="672" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-chip" x="580" y="692" width="24" height="24"/>
    <text x="620" y="700" font-size="14" font-weight="600" fill="#1a1a1a">Toolboxes</text>
    <text x="620" y="718" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Sandboxed TS tools</text>
  </g>
  <g class="node" id="n-external">
    <rect x="804" y="672" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-server" x="820" y="692" width="24" height="24"/>
    <text x="860" y="700" font-size="14" font-weight="600" fill="#1a1a1a">External MCP</text>
    <text x="860" y="718" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Aggregate + OAuth</text>
  </g>
  <g class="node" id="n-state">
    <rect x="324" y="864" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-database" x="340" y="884" width="24" height="24"/>
    <text x="380" y="892" font-size="14" font-weight="600" fill="#1a1a1a">Local State</text>
    <text x="380" y="910" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Summaries, rules</text>
  </g>
  <g class="node" id="n-remote">
    <rect x="804" y="864" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-cloud" x="820" y="884" width="24" height="24"/>
    <text x="860" y="892" font-size="14" font-weight="600" fill="#1a1a1a">Remote MCP</text>
    <text x="860" y="910" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Third-party servers</text>
  </g>

  <!-- 資料流標籤 -->
  <g class="label" id="l-mcp-request" data-edge="e-tunnel-client">
    <rect x="426" y="296" width="84" height="14" fill="#faf8f4"/>
    <text x="430" y="306" font-size="10" letter-spacing="1" fill="#1a1a1a">MCP REQUEST</text>
  </g>
</svg>
