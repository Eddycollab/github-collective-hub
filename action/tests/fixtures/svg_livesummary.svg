<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 912" role="img" aria-labelledby="livesummary-title livesummary-desc" font-family="'JetBrains Mono',monospace">
  <title id="livesummary-title">LiveSummary system overview</title>
  <desc id="livesummary-desc">Stream capture pulls audio and chat from Twitch or YouTube, a local Whisper transcriber feeds a topic engine and a translator, both call LLM providers through a shared LLM client, and results are shown in a PySide6 desktop app and saved to output files.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <symbol id="icon-browser" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="16" rx="2"/>
      <line x1="2" y1="9" x2="22" y2="9"/>
      <circle cx="5.5" cy="6.5" r="0.5"/>
      <circle cx="8" cy="6.5" r="0.5"/>
    </symbol>
    <symbol id="icon-terminal" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="16" rx="2"/>
      <path d="M6 10l3 2-3 2"/>
      <line x1="11" y1="15" x2="16" y2="15"/>
    </symbol>
    <symbol id="icon-server" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="7" rx="2"/>
      <rect x="3" y="13" width="18" height="7" rx="2"/>
      <circle cx="7" cy="7.5" r="0.6"/>
      <circle cx="7" cy="16.5" r="0.6"/>
    </symbol>
    <symbol id="icon-cloud" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 18a4.5 4.5 0 1 1 .8-8.9A6 6 0 0 1 19.5 11 3.75 3.75 0 0 1 18 18H7z"/>
    </symbol>
    <symbol id="icon-chip" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="12" height="12" rx="2"/>
      <rect x="9.5" y="9.5" width="5" height="5"/>
      <path d="M9 6V3M15 6V3M9 21v-3M15 21v-3M6 9H3M6 15H3M21 9h-3M21 15h-3"/>
    </symbol>
    <symbol id="icon-file" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2h8l4 4v16H6V2z"/>
      <path d="M14 2v4h4"/>
      <line x1="9" y1="12" x2="15" y2="12"/>
      <line x1="9" y1="16" x2="15" y2="16"/>
    </symbol>
    <symbol id="icon-gear" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3.2"/>
      <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10.5" cy="10.5" r="6.5"/>
      <line x1="15.5" y1="15.5" x2="21" y2="21"/>
    </symbol>
    <symbol id="icon-sparkle" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/>
      <path d="M19 16l.9 2.1L22 19l-2.1.9L19 22l-.9-2.1L16 19l2.1-.9L19 16z"/>
    </symbol>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="912" fill="#faf8f4"/>

  <!-- 主標題 -->
  <text x="600" y="84" font-size="28" letter-spacing="6" text-anchor="middle" fill="#1a1a1a">LIVESUMMARY · SYSTEM OVERVIEW</text>

  <!-- 分區容器 -->
  <g class="zone" id="zone-sources" fill="none" stroke="#1a1a1a">
    <rect x="540" y="120" width="240" height="152" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="564" y="148" font-size="16" letter-spacing="3" fill="#1a1a1a" stroke="none">STREAM SOURCES</text>
    <line x1="564" y1="156" x2="612" y2="156" stroke-width="1"/>
  </g>
  <g class="zone" id="zone-capture" fill="none" stroke="#1a1a1a">
    <rect x="300" y="312" width="480" height="152" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="324" y="340" font-size="16" letter-spacing="3" fill="#1a1a1a" stroke="none">CAPTURE</text>
    <line x1="324" y1="348" x2="372" y2="348" stroke-width="1"/>
  </g>
  <g class="zone" id="zone-data" fill="none" stroke="#1a1a1a">
    <rect x="860" y="312" width="240" height="152" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="884" y="340" font-size="16" letter-spacing="3" fill="#1a1a1a" stroke="none">LOCAL DATA</text>
    <line x1="884" y1="348" x2="932" y2="348" stroke-width="1"/>
  </g>
  <g class="zone" id="zone-processing" fill="none" stroke="#1a1a1a">
    <rect x="60" y="504" width="720" height="152" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="84" y="532" font-size="16" letter-spacing="3" fill="#1a1a1a" stroke="none">PROCESSING</text>
    <line x1="84" y1="540" x2="132" y2="540" stroke-width="1"/>
  </g>
  <g class="zone" id="zone-ui" fill="none" stroke="#1a1a1a">
    <rect x="60" y="696" width="240" height="152" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="84" y="724" font-size="16" letter-spacing="3" fill="#1a1a1a" stroke="none">DESKTOP UI</text>
    <line x1="84" y1="732" x2="132" y2="732" stroke-width="1"/>
  </g>
  <g class="zone" id="zone-external" fill="none" stroke="#1a1a1a">
    <rect x="340" y="696" width="240" height="152" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="364" y="724" font-size="16" letter-spacing="3" fill="#1a1a1a" stroke="none">EXTERNAL</text>
    <line x1="364" y1="732" x2="412" y2="732" stroke-width="1"/>
  </g>

  <!-- 連線（先畫線、後畫節點） -->
  <g fill="none" stroke="#1a1a1a" stroke-width="1.5">
    <path class="edge" id="e-platform-capture" d="M660,248 V370" marker-end="url(#ah)"/>
    <path class="edge" id="e-capture-transcriber" d="M564,408 H522" marker-end="url(#ah)"/>
    <path class="edge" id="e-capture-files" d="M756,408 H878" marker-end="url(#ah)"/>
    <path class="edge" id="e-transcriber-topics" d="M372,440 V480 H244 V562" marker-end="url(#ah)"/>
    <path class="edge" id="e-transcriber-translator" d="M468,440 V488 H612 V562" marker-end="url(#ah)"/>
    <path class="edge" id="e-capture-translator" d="M708,440 V562" marker-end="url(#ah)"/>
    <path class="edge" id="e-topics-llm" d="M276,600 H318" marker-end="url(#ah)"/>
    <path class="edge" id="e-translator-llm" d="M564,600 H522" marker-end="url(#ah)"/>
    <path class="edge" id="e-llm-providers" d="M500,632 V754" marker-end="url(#ah)"/>
    <path class="edge" id="e-topics-app" d="M244,632 V754" marker-end="url(#ah)"/>
    <path class="edge" id="e-translator-app" d="M660,632 V672 H508 a8,8 0 0,0 -16,0 H320 V792 H282" marker-end="url(#ah)"/>
  </g>

  <!-- 節點 -->
  <g class="node" id="n-platform">
    <rect x="564" y="184" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-cloud" x="580" y="204" width="24" height="24"/>
    <text x="620" y="212" font-size="14" font-weight="600" fill="#1a1a1a">Twitch/YouTube</text>
    <text x="620" y="230" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Live HLS + chat</text>
  </g>
  <g class="node" id="n-transcriber">
    <rect x="324" y="376" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-chip" x="340" y="396" width="24" height="24"/>
    <text x="380" y="404" font-size="14" font-weight="600" fill="#1a1a1a">Transcriber</text>
    <text x="380" y="422" font-size="11" fill="#1a1a1a" fill-opacity="0.65">faster-whisper STT</text>
  </g>
  <g class="node" id="n-capture">
    <rect x="564" y="376" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-terminal" x="580" y="396" width="24" height="24"/>
    <text x="620" y="404" font-size="14" font-weight="600" fill="#1a1a1a">Stream Capture</text>
    <text x="620" y="422" font-size="11" fill="#1a1a1a" fill-opacity="0.65">streamlink + ffmpeg</text>
  </g>
  <g class="node" id="n-files">
    <rect x="884" y="376" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-file" x="900" y="396" width="24" height="24"/>
    <text x="940" y="404" font-size="14" font-weight="600" fill="#1a1a1a">Output Files</text>
    <text x="940" y="422" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Transcripts + chat</text>
  </g>
  <g class="node" id="n-topics">
    <rect x="84" y="568" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-search" x="100" y="588" width="24" height="24"/>
    <text x="140" y="596" font-size="14" font-weight="600" fill="#1a1a1a">Topic Engine</text>
    <text x="140" y="614" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Minute/topic recaps</text>
  </g>
  <g class="node" id="n-llm">
    <rect x="324" y="568" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-server" x="340" y="588" width="24" height="24"/>
    <text x="380" y="596" font-size="14" font-weight="600" fill="#1a1a1a">LLM Client</text>
    <text x="380" y="614" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Unified calls + key</text>
  </g>
  <g class="node" id="n-translator">
    <rect x="564" y="568" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-gear" x="580" y="588" width="24" height="24"/>
    <text x="620" y="596" font-size="14" font-weight="600" fill="#1a1a1a">Translator</text>
    <text x="620" y="614" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Subtitles + chat</text>
  </g>
  <g class="node" id="n-app">
    <rect x="84" y="760" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-browser" x="100" y="780" width="24" height="24"/>
    <text x="140" y="788" font-size="14" font-weight="600" fill="#1a1a1a">Desktop App</text>
    <text x="140" y="806" font-size="11" fill="#1a1a1a" fill-opacity="0.65">PySide6 overlay UI</text>
  </g>
  <g class="node" id="n-providers">
    <rect x="364" y="760" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-sparkle" x="380" y="780" width="24" height="24"/>
    <text x="420" y="788" font-size="14" font-weight="600" fill="#1a1a1a">LLM Providers</text>
    <text x="420" y="806" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Claude/OpenAI/Gemini</text>
  </g>

  <!-- 資料流標籤（只標 payload 不明顯的線） -->
  <g class="label" id="l-audio-chat" data-edge="e-platform-capture">
    <rect x="666" y="284" width="91" height="14" fill="#faf8f4"/>
    <text x="670" y="294" font-size="10" letter-spacing="1" fill="#1a1a1a">AUDIO + CHAT</text>
  </g>
  <g class="label" id="l-chat-lines" data-edge="e-capture-translator">
    <rect x="714" y="474" width="77" height="14" fill="#faf8f4"/>
    <text x="718" y="484" font-size="10" letter-spacing="1" fill="#1a1a1a">CHAT LINES</text>
  </g>
</svg>
