<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 832" role="img" aria-labelledby="ocx-title ocx-desc" font-family="'JetBrains Mono',monospace">
  <title id="ocx-title">OpenChatX system overview</title>
  <desc id="ocx-desc">The desktop app forwards tunneled MCP requests and the dashboard UI calls the local HTTP server, whose MCP server factory exposes built-in tools, toolboxes, external MCP servers and subagents, backed by local registries and an audit log.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <symbol id="icon-browser" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="16" rx="2"/>
      <line x1="2" y1="9" x2="22" y2="9"/>
      <circle cx="5.5" cy="6.5" r="0.5"/>
      <circle cx="8" cy="6.5" r="0.5"/>
    </symbol>
    <symbol id="icon-terminal" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="16" rx="2"/>
      <path d="M6 10l3 2-3 2"/>
      <line x1="11" y1="15" x2="16" y2="15"/>
    </symbol>
    <symbol id="icon-server" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="7" rx="2"/>
      <rect x="3" y="13" width="18" height="7" rx="2"/>
      <circle cx="7" cy="7.5" r="0.6"/>
      <circle cx="7" cy="16.5" r="0.6"/>
    </symbol>
    <symbol id="icon-database" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="6" rx="8" ry="3"/>
      <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
      <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
    </symbol>
    <symbol id="icon-cloud" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 18a4.5 4.5 0 1 1 .8-8.9A6 6 0 0 1 19.5 11 3.75 3.75 0 0 1 18 18H7z"/>
    </symbol>
    <symbol id="icon-chip" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="12" height="12" rx="2"/>
      <rect x="9.5" y="9.5" width="5" height="5"/>
      <path d="M9 6V3M15 6V3M9 21v-3M15 21v-3M6 9H3M6 15H3M21 9h-3M21 15h-3"/>
    </symbol>
    <symbol id="icon-file" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2h8l4 4v16H6V2z"/>
      <path d="M14 2v4h4"/>
      <line x1="9" y1="12" x2="15" y2="12"/>
      <line x1="9" y1="16" x2="15" y2="16"/>
    </symbol>
    <symbol id="icon-gear" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3.2"/>
      <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/>
    </symbol>
    <symbol id="icon-sparkle" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/>
      <path d="M19 16l.9 2.1L22 19l-2.1.9L19 22l-.9-2.1L16 19l2.1-.9L19 16z"/>
    </symbol>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="832" fill="#faf8f4"/>

  <!-- 主標題 -->
  <text x="600" y="84" font-size="28" letter-spacing="6" text-anchor="middle" fill="#1a1a1a">OPENCHATX · SYSTEM OVERVIEW</text>

  <!-- 分區容器 -->
  <g class="zone" id="zone-host" fill="none" stroke="#1a1a1a">
    <rect x="160" y="120" width="500" height="152" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="184" y="148" font-size="16" letter-spacing="3" fill="#1a1a1a" stroke="none">LOCAL HOST</text>
    <line x1="184" y1="156" x2="232" y2="156" stroke-width="1"/>
  </g>
  <g class="zone" id="zone-runtime" fill="none" stroke="#1a1a1a">
    <rect x="60" y="312" width="1080" height="264" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="84" y="340" font-size="16" letter-spacing="3" fill="#1a1a1a" stroke="none">MCP RUNTIME</text>
    <line x1="84" y1="348" x2="132" y2="348" stroke-width="1"/>
  </g>
  <g class="zone" id="zone-state" fill="none" stroke="#1a1a1a">
    <rect x="60" y="616" width="1080" height="152" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="84" y="644" font-size="16" letter-spacing="3" fill="#1a1a1a" stroke="none">LOCAL STATE</text>
    <line x1="84" y1="652" x2="132" y2="652" stroke-width="1"/>
  </g>

  <!-- 連線 -->
  <g fill="none" stroke="#1a1a1a" stroke-width="1.5">
    <path class="edge" id="e-desktop-http" d="M248,248 V370" marker-end="url(#ah)"/>
    <path class="edge" id="e-ui-http" d="M476,248 V292 H312 V370" marker-end="url(#ah)"/>
    <path class="edge" id="e-http-factory" d="M376,408 H498" marker-end="url(#ah)"/>
    <path class="edge" id="e-http-audit" d="M320,440 V452 a8,8 0 0,1 0,16 V674" stroke-dasharray="4 4"/>
    <path class="edge" id="e-factory-tools" d="M520,440 V460 H180 V482" marker-end="url(#ah)"/>
    <path class="edge" id="e-factory-toolbox" d="M544,440 V482" marker-end="url(#ah)"/>
    <path class="edge" id="e-factory-extmcp" d="M664,440 V482" marker-end="url(#ah)"/>
    <path class="edge" id="e-factory-subagents" d="M696,400 H1020 V482" marker-end="url(#ah)"/>
    <path class="edge" id="e-factory-registries" d="M696,424 H880 V674" marker-end="url(#ah)"/>
  </g>

  <!-- 節點 -->
  <g class="node" id="n-desktop">
    <rect x="184" y="184" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-gear" x="200" y="204" width="24" height="24"/>
    <text x="240" y="212" font-size="14" font-weight="600" fill="#1a1a1a">Desktop App</text>
    <text x="240" y="230" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Runs runtime+tunnel</text>
  </g>
  <g class="node" id="n-ui">
    <rect x="444" y="184" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-browser" x="460" y="204" width="24" height="24"/>
    <text x="500" y="212" font-size="14" font-weight="600" fill="#1a1a1a">Dashboard UI</text>
    <text x="500" y="230" font-size="11" fill="#1a1a1a" fill-opacity="0.65">React admin console</text>
  </g>
  <g class="node" id="n-http">
    <rect x="184" y="376" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-server" x="200" y="396" width="24" height="24"/>
    <text x="240" y="404" font-size="14" font-weight="600" fill="#1a1a1a">HTTP Server</text>
    <text x="240" y="422" font-size="11" fill="#1a1a1a" fill-opacity="0.65">MCP + dashboard API</text>
  </g>
  <g class="node" id="n-factory">
    <rect x="504" y="376" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-chip" x="520" y="396" width="24" height="24"/>
    <text x="560" y="404" font-size="14" font-weight="600" fill="#1a1a1a">Server Factory</text>
    <text x="560" y="422" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Per-session tools</text>
  </g>
  <g class="node" id="n-tools">
    <rect x="84" y="488" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-terminal" x="100" y="508" width="24" height="24"/>
    <text x="140" y="516" font-size="14" font-weight="600" fill="#1a1a1a">Built-in Tools</text>
    <text x="140" y="534" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Shell, files, web</text>
  </g>
  <g class="node" id="n-toolbox">
    <rect x="364" y="488" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-file" x="380" y="508" width="24" height="24"/>
    <text x="420" y="516" font-size="14" font-weight="600" fill="#1a1a1a">Toolboxes</text>
    <text x="420" y="534" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Skills+rules+tools</text>
  </g>
  <g class="node" id="n-extmcp">
    <rect x="644" y="488" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-cloud" x="660" y="508" width="24" height="24"/>
    <text x="700" y="516" font-size="14" font-weight="600" fill="#1a1a1a">External MCP</text>
    <text x="700" y="534" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Proxied MCP servers</text>
  </g>
  <g class="node" id="n-subagents">
    <rect x="924" y="488" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-sparkle" x="940" y="508" width="24" height="24"/>
    <text x="980" y="516" font-size="14" font-weight="600" fill="#1a1a1a">Subagents</text>
    <text x="980" y="534" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Model profiles</text>
  </g>
  <g class="node" id="n-audit">
    <rect x="224" y="680" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-file" x="240" y="700" width="24" height="24"/>
    <text x="280" y="708" font-size="14" font-weight="600" fill="#1a1a1a">Audit Log</text>
    <text x="280" y="726" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Tool call YAML log</text>
  </g>
  <g class="node" id="n-registries">
    <rect x="784" y="680" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-database" x="800" y="700" width="24" height="24"/>
    <text x="840" y="708" font-size="14" font-weight="600" fill="#1a1a1a">Registries</text>
    <text x="840" y="726" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Projects+summaries</text>
  </g>

  <!-- 資料流標籤 -->
  <g class="label" id="l-mcp-requests" data-edge="e-desktop-http">
    <rect x="151" y="288" width="91" height="14" fill="#faf8f4"/>
    <text x="155" y="298" font-size="10" letter-spacing="1" fill="#1a1a1a">MCP REQUESTS</text>
  </g>
  <g class="label" id="l-tool-calls" data-edge="e-http-audit">
    <rect x="326" y="588" width="77" height="14" fill="#faf8f4"/>
    <text x="330" y="598" font-size="10" letter-spacing="1" fill="#1a1a1a">TOOL CALLS</text>
  </g>
</svg>
